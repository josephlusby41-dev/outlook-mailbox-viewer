<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Console</title>
<style>
  :root {
    color-scheme: light;
    --navy: #112b41;
    --ink: #1b2e40;
    --muted: #556b7d;
    --blue: #175e85;
    --line: #dbe5ec;
    --wash: #eef4f7;
    --selected: #e1f0f5;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--wash); color: var(--ink); font: 14px system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }
  :focus-visible { outline: 3px solid #c58319; outline-offset: 2px; }
  [hidden] { display: none !important; }
  button, input, select, textarea { border: 1px solid #b9cad6; border-radius: 8px; padding: 8px 10px; background: white; color: inherit; }
  button:hover:not(:disabled) { background: var(--selected); }
  .primary { background: var(--blue); color: white; border-color: var(--blue); font-weight: 650; }
  .primary:hover:not(:disabled) { background: #104768; }
  .danger { color: #a42636; }
  .muted { color: var(--muted); }
  .top {
    min-height: 64px; display: flex; flex-wrap: wrap; align-items: center;
    gap: 10px; padding: 12px 18px; color: white; background: var(--navy);
  }
  .top h1 { font-size: 19px; margin: 0 auto 0 0; }
  .top button { color: white; background: #26475e; border-color: #47677c; }
  .top button:hover:not(:disabled) { background: #365b72; }
  #account { color: #d5e5ee; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shell {
    display: grid; grid-template-columns: 205px minmax(0, 1fr);
    height: calc(100dvh - 64px); gap: 14px; padding: 14px;
  }
  .sidebar { overflow: auto; }
  .sidebar h2 { font-size: 13px; color: var(--muted); padding-left: 10px; margin: 18px 0 7px; }
  .sidebar > button { width: 100%; text-align: left; }
  .folder {
    width: 100%; border-color: transparent; background: transparent;
    display: flex; justify-content: space-between; gap: 8px; text-align: left;
  }
  .folder[aria-current="true"] { background: #dcebf1; font-weight: 650; }
  .count { color: #155978; font-size: 12px; font-weight: 700; }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 12px; }
  .toolbar, .search, .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
  .search { flex: 1; min-width: 235px; }
  .search input { flex: 1; min-width: 115px; }
  .panes {
    display: grid; grid-template-columns: minmax(230px, 38%) minmax(0, 1fr);
    flex: 1; gap: 12px; min-height: 0;
  }
  .list, .reader {
    background: white; border: 1px solid var(--line); border-radius: 14px;
    min-width: 0; overflow: auto;
  }
  .list-heading {
    display: flex; align-items: center; gap: 10px; padding: 12px;
    position: sticky; top: 0; z-index: 1; background: white; border-bottom: 1px solid var(--line);
  }
  .list-heading h2 { flex: 1; font-size: 15px; margin: 0; }
  .list-footer, #rows > p { margin: 0; padding: 14px; }
  .message {
    display: grid; grid-template-columns: 20px minmax(0, 1fr);
    gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .message.unread { box-shadow: inset 3px 0 var(--blue); }
  .message.unread .subject { font-weight: 720; color: #155779; }
  .message.current { background: var(--selected); }
  .message button { width: 100%; border: 0; background: transparent; padding: 0; text-align: left; min-width: 0; }
  .message button span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; }
  .message button .envelope { display: flex; justify-content: space-between; gap: 6px; }
  .message strong { overflow: hidden; text-overflow: ellipsis; }
  .message time { flex: none; font-size: 11px; color: var(--muted); }
  .reader { padding: 22px; }
  .reader h2 { margin: 0 0 12px; overflow-wrap: anywhere; }
  .reader .actions { margin: 14px 0; }
  .placeholder { height: 100%; display: grid; place-content: center; margin: 0; text-align: center; }
  .message-body { overflow: auto; overflow-wrap: anywhere; line-height: 1.55; }
  .message-body img { max-width: 100%; }
  .message-body pre { white-space: pre-wrap; }
  .back { display: none; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(600px, 94vw); max-height: 90dvh; }
  dialog::backdrop { background: #102a4066; }
  dialog h2 { margin: 0 0 14px; }
  dialog label { display: block; margin: 10px 0; }
  dialog input:not([type=checkbox]), dialog textarea, dialog select { display: block; width: 100%; margin-top: 4px; }
  dialog textarea { min-height: 145px; resize: vertical; }
  dialog .actions { justify-content: flex-end; margin-top: 15px; }
  .rule { border-bottom: 1px solid var(--line); padding: 8px 0; }
  #notice {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 4; color: white; background: var(--navy); border-radius: 8px;
    padding: 10px 14px; max-width: 90vw;
  }
  @media (max-width: 760px) {
    .shell { display: block; height: auto; padding: 10px; }
    .sidebar { margin-bottom: 10px; }
    .sidebar > button { width: auto; }
    .sidebar h2 { display: none; }
    #folders { display: flex; overflow: auto; margin-top: 8px; }
    .folder { width: auto; flex: none; white-space: nowrap; }
    .panes { display: block; }
    .reader { display: none; }
    .panes.reading .reader { display: block; }
    .panes.reading .list { display: none; }
    .back { display: inline-block; margin-bottom: 12px; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Mail Console</h1>
  <span id="account"></span>
  <button id="rules">Inbox rules</button>
  <button id="logout">Sign out</button>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="Mailbox navigation">
    <button class="primary" id="newMail">＋ New mail</button>
    <h2>Folders</h2>
    <nav id="folders" aria-label="Mail folders"></nav>
  </aside>

  <main class="main">
    <div class="toolbar">
      <form class="search" id="searchForm" role="search">
        <input id="search" type="search" placeholder="Search mail" aria-label="Search mail">
        <select id="scope" aria-label="Search scope">
          <option value="folder">This folder</option>
          <option value="all">All folders</option>
        </select>
        <button type="submit" class="primary">Search</button>
        <button type="button" id="clearSearch">Clear</button>
      </form>
      <div class="actions" aria-label="Actions for selected messages">
        <button id="refresh">Refresh</button>
        <button id="markRead">Mark read</button>
        <button id="markUnread">Mark unread</button>
        <button id="archive">Archive</button>
        <button id="move">Move…</button>
        <button id="delete" class="danger">Delete</button>
      </div>
    </div>

    <div class="panes" id="panes">
      <section class="list" aria-labelledby="listTitle">
        <div class="list-heading">
          <input id="selectAll" type="checkbox" aria-label="Select loaded messages">
          <h2 id="listTitle">Inbox</h2>
          <select id="filter" aria-label="Filter messages">
            <option value="all">All mail</option>
            <option value="unread">Unread</option>
          </select>
        </div>
        <div id="rows"></div>
        <div class="list-footer"><button id="more" hidden>Load more</button></div>
      </section>
      <section class="reader" id="reader" aria-label="Reading pane"></section>
    </div>
  </main>
</div>

<dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
<div id="notice" role="status" hidden></div>

<script>
const CSRF = '__CSRF__';
const byId = id => document.getElementById(id);
const state = {
  folder: 'inbox', folders: [], messages: [], selected: new Set(),
  cursor: null, query: '', openId: null, listRequest: 0, readerRequest: 0,
};

function escapeHtml(value) {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function notice(message) {
  const node = byId('notice');
  node.textContent = message;
  node.hidden = false;
  clearTimeout(node.timer);
  node.timer = setTimeout(() => { node.hidden = true; }, 4500);
}

async function request(path, method = 'GET', data) {
  const response = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
    body: data === undefined ? undefined : JSON.stringify(data),
  });
  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    throw new Error(error.message || `Request failed (${response.status}).`);
  }
  return response;
}

async function api(path, method, data) {
  const response = await request(path, method, data);
  return response.status === 204 ? {} : response.json();
}

function graph(method, path, payload, query) {
  return api('/api/graph', 'POST', { method, path, payload, query });
}

function messageUrl(id) {
  return '/api/messages/' + encodeURIComponent(id);
}

function graphMessage(id) {
  return '/me/messages/' + encodeURIComponent(id);
}

function addressOf(recipient) {
  return recipient?.emailAddress || {};
}

function recipients(value) {
  return value.split(/[,;]/).map(address => address.trim()).filter(Boolean)
    .map(address => ({ emailAddress: { address } }));
}

function dateLabel(value, short = false) {
  const date = new Date(value);
  if (!value || Number.isNaN(+date)) return '';
  return short
    ? date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    : date.toLocaleString();
}

function makeButton(label, action, className = '') {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = className;
  button.textContent = label;
  button.onclick = async () => {
    button.disabled = true;
    try { await action(); }
    catch (error) { notice(error.message); }
    finally { button.disabled = false; }
  };
  return button;
}

function showDialog(content) {
  const dialog = byId('dialog');
  dialog.innerHTML = content;
  if (!dialog.open) dialog.showModal();
  dialog.querySelector('[data-close]')?.addEventListener('click', () => dialog.close());
}

function renderFolders() {
  const nav = byId('folders');
  nav.replaceChildren();
  for (const folder of state.folders) {
    const label = folder.displayName || 'Folder';
    const button = makeButton(label, async () => {
      state.folder = folder.id;
      byId('scope').value = 'folder';
      renderFolders();
      await loadMail();
    }, 'folder');
    if (folder.id === state.folder) button.setAttribute('aria-current', 'true');
    if (folder.unreadItemCount) {
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = folder.unreadItemCount;
      button.append(count);
    }
    nav.append(button);
  }
}

async function loadFolders() {
  try {
    const result = await api('/api/folders');
    state.folders = result.folders || [];
    if (state.folder === 'inbox') {
      const inbox = state.folders.find(folder => /^inbox$/i.test(folder.displayName));
      if (inbox) state.folder = inbox.id;
    }
    renderFolders();
  } catch (error) { notice(error.message); }
}

function closeReader() {
  state.readerRequest++;
  state.openId = null;
  byId('panes').classList.remove('reading');
  byId('reader').innerHTML = '<p class="placeholder muted">Select a message to read it</p>';
  byId('rows').querySelector('.current')?.classList.remove('current');
}

async function loadMail(append = false) {
  if (append && !state.cursor) return;
  const serial = ++state.listRequest;
  const rows = byId('rows');
  const more = byId('more');
  const query = append ? new URLSearchParams(state.query) : new URLSearchParams();

  if (append) {
    query.set('cursor', state.cursor);
  } else {
    const search = byId('search').value.trim();
    const allFolders = search && byId('scope').value === 'all';
    const current = state.folders.find(folder => folder.id === state.folder);
    query.set('folder', allFolders ? 'all' : state.folder);
    if (search) query.set('search', search);
    else if (byId('filter').value === 'unread') query.set('unread', '1');

    byId('filter').disabled = Boolean(search);
    byId('listTitle').textContent = search
      ? (allFolders ? 'All folders · Search results' : 'Search results')
      : current?.displayName || 'Inbox';
    state.query = query.toString();
    state.cursor = null;
    state.messages = [];
    state.selected.clear();
    updateSelection();
    closeReader();
    rows.innerHTML = '<p class="muted">Loading messages…</p>';
    more.hidden = true;
  }

  rows.setAttribute('aria-busy', 'true');
  more.disabled = true;
  try {
    const result = await api('/api/messages?' + query);
    if (serial !== state.listRequest) return;
    const seen = new Set(state.messages.map(message => message.id));
    for (const message of result.messages || []) {
      if (seen.has(message.id)) continue;
      state.messages.push(message);
      seen.add(message.id);
    }
    state.cursor = result.cursor;
    renderMessages();
  } catch (error) {
    if (serial !== state.listRequest) return;
    if (append) notice(error.message);
    else rows.innerHTML = '<p role="alert">' + escapeHtml(error.message) + '</p>';
  } finally {
    if (serial === state.listRequest) {
      rows.setAttribute('aria-busy', 'false');
      more.hidden = !state.cursor;
      more.disabled = false;
    }
  }
}

function updateSelection() {
  const selectAll = byId('selectAll');
  const count = state.selected.size;
  selectAll.checked = count > 0 && count === state.messages.length;
  selectAll.indeterminate = count > 0 && !selectAll.checked;
  for (const id of ['markRead', 'markUnread', 'archive', 'move', 'delete']) {
    byId(id).disabled = count === 0;
  }
}

function renderMessages() {
  const rows = byId('rows');
  const current = state.folders.find(folder => folder.id === state.folder);
  const allFolders = new URLSearchParams(state.query).get('folder') === 'all';
  const outgoing = !allFolders && /^(sent items|drafts|outbox)$/i.test(current?.displayName || '');
  rows.replaceChildren();

  for (const message of state.messages) {
    const article = document.createElement('article');
    article.className = 'message' + (message.isRead ? '' : ' unread')
      + (state.openId === message.id ? ' current' : '');
    article.dataset.id = message.id;

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = state.selected.has(message.id);
    checkbox.setAttribute('aria-label', 'Select ' + (message.subject || 'message'));
    checkbox.onchange = () => {
      if (checkbox.checked) state.selected.add(message.id);
      else state.selected.delete(message.id);
      updateSelection();
    };

    const address = addressOf(outgoing ? message.toRecipients?.[0] : message.from);
    const subject = escapeHtml(message.subject || '(no subject)');
    const open = document.createElement('button');
    open.type = 'button';
    open.innerHTML = `<span class="envelope">
        <strong>${escapeHtml(address.name || address.address || 'Unknown')}</strong>
        <time>${escapeHtml(dateLabel((outgoing && message.sentDateTime) || message.receivedDateTime, true))}</time>
      </span>
      <span class="subject">${message.hasAttachments ? '📎 ' : ''}${message.flag?.flagStatus === 'flagged' ? '⚑ ' : ''}${subject}</span>
      <span class="muted">${escapeHtml(message.bodyPreview)}</span>`;
    open.onclick = () => openMessage(message.id);
    article.append(checkbox, open);
    rows.append(article);
  }
  if (!state.messages.length) rows.innerHTML = '<p class="muted">No messages found.</p>';
  updateSelection();
}

async function openMessage(id) {
  const serial = ++state.readerRequest;
  state.openId = id;
  for (const row of byId('rows').querySelectorAll('.message')) {
    row.classList.toggle('current', row.dataset.id === id);
  }
  byId('panes').classList.add('reading');
  const reader = byId('reader');
  const back = makeButton('Back to messages', closeReader, 'back');
  const status = document.createElement('p');
  status.textContent = 'Loading message…';
  reader.replaceChildren(back, status);

  try {
    const message = await api(messageUrl(id));
    if (serial !== state.readerRequest) return;
    const from = addressOf(message.from);
    const to = (message.toRecipients || []).map(item => addressOf(item).address).filter(Boolean);
    const heading = document.createElement('div');
    heading.innerHTML = `<h2>${escapeHtml(message.subject || '(no subject)')}</h2>
      <p class="muted"><b>From</b> ${escapeHtml(from.address || from.name)}
      <br><b>To</b> ${escapeHtml(to.join(', '))}
      <br>${escapeHtml(dateLabel(message.receivedDateTime || message.sentDateTime))}</p>`;

    const actions = document.createElement('div');
    actions.className = 'actions';
    if (message.isDraft) {
      actions.append(makeButton('Edit draft', () => compose('draft', message), 'primary'));
    } else {
      actions.append(
        makeButton('Reply', () => compose('reply', message), 'primary'),
        makeButton('Reply all', () => compose('replyAll', message)),
        makeButton('Forward', () => compose('forward', message)),
      );
    }
    const flagged = message.flag?.flagStatus === 'flagged';
    actions.append(
      makeButton(message.isRead ? 'Mark unread' : 'Mark read', async () => {
        const isRead = !message.isRead;
        await api(messageUrl(id) + '/read', 'POST', { isRead });
        const item = state.messages.find(entry => entry.id === id);
        if (item) item.isRead = isRead;
        if (byId('filter').value === 'unread' && !byId('filter').disabled && isRead) {
          await loadMail();
        } else {
          renderMessages();
          if (serial === state.readerRequest) await openMessage(id);
        }
        await loadFolders();
      }),
      makeButton(flagged ? 'Clear flag' : 'Flag', async () => {
        const flag = { flagStatus: flagged ? 'notFlagged' : 'flagged' };
        await graph('PATCH', graphMessage(id), { flag });
        const item = state.messages.find(entry => entry.id === id);
        if (item) item.flag = flag;
        renderMessages();
        if (serial === state.readerRequest) await openMessage(id);
      }),
      makeButton('Delete', async () => {
        if (confirm('Delete this message?')) {
          await api(messageUrl(id), 'DELETE');
          await refresh();
        }
      }, 'danger'),
    );

    const attachments = document.createElement('div');
    attachments.className = 'actions';
    const body = document.createElement('div');
    body.className = 'message-body';
    body.innerHTML = message.safeHtml || escapeHtml(message.bodyPreview);
    reader.replaceChildren(back, heading, actions, attachments);
    if (message.imageNotice) {
      const hint = document.createElement('p');
      hint.className = 'muted';
      hint.textContent = message.imageNotice;
      reader.append(hint);
    }
    reader.append(body);

    if (message.hasAttachments) await loadAttachments(id, attachments);
  } catch (error) {
    if (serial === state.readerRequest) status.textContent = error.message;
  }
}

async function loadAttachments(id, container) {
  try {
    const result = await graph('GET', graphMessage(id) + '/attachments', undefined, {
      '$select': 'id,name,isInline,contentType,size',
    });
    for (const attachment of result.value || []) {
      if (attachment.isInline) continue;
      const name = attachment.name || 'Attachment';
      container.append(makeButton('Download ' + name, async () => {
        const path = graphMessage(id) + '/attachments/' + encodeURIComponent(attachment.id) + '/$value';
        const response = await request('/api/download', 'POST', { path, name });
        const url = URL.createObjectURL(await response.blob());
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = name;
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }));
    }
  } catch (error) {
    container.textContent = error.message;
  }
}

async function refresh() {
  await Promise.all([loadMail(), loadFolders()]);
}

async function bulk(ids, operation, label) {
  let count = 0;
  try {
    for (const id of ids) {
      await operation(id);
      count++;
    }
    notice(`${label} ${count} message(s).`);
  } catch (error) {
    notice(`${label} ${count} of ${ids.length} message(s). ${error.message}`);
  } finally {
    await refresh();
  }
}

function markSelected(isRead) {
  return bulk([...state.selected], id => api(messageUrl(id) + '/read', 'POST', { isRead }),
    isRead ? 'Marked read' : 'Marked unread');
}

function moveSelected() {
  const ids = [...state.selected];
  if (!ids.length) return;
  showDialog(`<h2 id="dialogTitle">Move ${ids.length} message(s)</h2>
    <label>Destination<select id="destination"></select></label>
    <div class="actions"><button data-close>Cancel</button><button class="primary" id="confirmMove">Move</button></div>`);
  for (const folder of state.folders) {
    byId('destination').add(new Option(folder.displayName, folder.id));
  }
  byId('confirmMove').onclick = () => {
    const destinationId = byId('destination').value;
    if (!destinationId) return;
    byId('dialog').close();
    bulk(ids, id => api(messageUrl(id) + '/move', 'POST', { destinationId }), 'Moved');
  };
}

function compose(mode = 'new', message) {
  const title = { new: 'New mail', draft: 'Edit draft', reply: 'Reply', replyAll: 'Reply all', forward: 'Forward' }[mode];
  const editable = mode === 'new' || mode === 'draft';
  const needsAddress = editable || mode === 'forward';
  showDialog(`<h2 id="dialogTitle">${title}</h2>
    ${needsAddress ? '<label>To<input id="to" placeholder="Separate addresses with commas"></label>' : ''}
    ${editable ? '<label>Cc<input id="cc"></label><label>Bcc<input id="bcc"></label><label>Subject<input id="subject"></label>' :
      '<p class="muted">' + escapeHtml(message.subject || '(no subject)') + '</p>'}
    <label>Message<textarea id="content"></textarea></label>
    <div class="actions"><button data-close>Cancel</button>
      ${editable ? '<button id="saveDraft">Save draft</button>' : ''}
      <button id="send" class="primary">Send</button>
    </div>`);

  if (mode === 'draft') {
    for (const [field, key] of [['to', 'toRecipients'], ['cc', 'ccRecipients'], ['bcc', 'bccRecipients']]) {
      byId(field).value = (message[key] || []).map(item => addressOf(item).address).filter(Boolean).join(', ');
    }
    byId('subject').value = message.subject || '';
    byId('content').value = message.body?.content || '';
  }

  const content = () => ({
    subject: byId('subject')?.value || '',
    body: byId('content').value,
    to: byId('to')?.value || '',
    cc: byId('cc')?.value || '',
    bcc: byId('bcc')?.value || '',
  });

  function draftPayload(values) {
    return {
      subject: values.subject,
      body: { contentType: 'HTML', content: values.body },
      toRecipients: recipients(values.to),
      ccRecipients: recipients(values.cc),
      bccRecipients: recipients(values.bcc),
    };
  }

  const dialog = byId('dialog');
  const send = byId('send');
  const save = byId('saveDraft');

  async function submit(action, success) {
    send.disabled = true;
    if (save) save.disabled = true;
    try {
      await action(content());
      if (send.isConnected) dialog.close();
      notice(success);
      await refresh();
    } catch (error) {
      notice(error.message);
    } finally {
      send.disabled = false;
      if (save) save.disabled = false;
    }
  }

  if (save) save.onclick = () => submit(values => mode === 'draft'
    ? graph('PATCH', graphMessage(message.id), draftPayload(values))
    : graph('POST', '/me/messages', draftPayload(values)), 'Draft saved.');

  send.onclick = () => submit(async values => {
    if (needsAddress && !recipients(values.to).length) throw new Error('Enter at least one recipient.');
    if (mode === 'new') {
      await api('/api/send', 'POST', values);
    } else if (mode === 'draft') {
      await graph('PATCH', graphMessage(message.id), draftPayload(values));
      await graph('POST', graphMessage(message.id) + '/send');
    } else {
      const payload = { comment: values.body };
      if (mode === 'forward') payload.toRecipients = recipients(values.to);
      await graph('POST', graphMessage(message.id) + '/' + mode, payload);
    }
  }, 'Sent.');
}

async function showRules() {
  const result = await api('/api/rules');
  showDialog(`<h2 id="dialogTitle">Inbox rules</h2><div id="ruleRows"></div>
    <div class="actions"><button data-close>Close</button><button id="newRule" class="primary">New rule</button></div>`);
  byId('newRule').onclick = () => editRule();
  const rows = byId('ruleRows');
  for (const rule of result.rules || []) {
    const row = document.createElement('div');
    row.className = 'rule';
    const title = document.createElement('strong');
    title.textContent = rule.displayName + (rule.isEnabled === false ? ' (disabled)' : '');
    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.append(
      makeButton('Edit', () => editRule(rule)),
      makeButton('Delete', async () => {
        if (!confirm('Delete this inbox rule?')) return;
        await api('/api/rules/' + encodeURIComponent(rule.id), 'DELETE');
        await showRules();
      }, 'danger'),
    );
    row.append(title, actions);
    rows.append(row);
  }
  if (!rows.children.length) rows.textContent = 'No inbox rules.';
}

function editRule(rule) {
  showDialog(`<h2 id="dialogTitle">${rule ? 'Edit rule' : 'New rule'}</h2>
    <label>Rule name<input id="ruleName"></label>
    <label>Sender contains<input id="ruleSender"></label>
    <label>Subject contains<input id="ruleSubject"></label>
    <label>Move to folder<select id="ruleFolder"><option value="">None</option></select></label>
    <label><input type="checkbox" id="ruleDelete"> Delete the message</label>
    <label><input type="checkbox" id="ruleRead"> Mark as read</label>
    <div class="actions"><button data-close>Cancel</button><button class="primary" id="saveRule">Save rule</button></div>`);
  for (const folder of state.folders) {
    byId('ruleFolder').add(new Option(folder.displayName, folder.id));
  }
  byId('ruleName').value = rule?.displayName || '';
  byId('ruleSender').value = (rule?.conditions?.senderContains || []).join(', ');
  byId('ruleSubject').value = (rule?.conditions?.subjectContains || []).join(', ');
  byId('ruleFolder').value = rule?.actions?.moveToFolder || '';
  byId('ruleDelete').checked = Boolean(rule?.actions?.delete);
  byId('ruleRead').checked = Boolean(rule?.actions?.markAsRead);

  const save = byId('saveRule');
  save.onclick = async () => {
    save.disabled = true;
    const data = {
      displayName: byId('ruleName').value,
      fromContains: byId('ruleSender').value,
      subjectContains: byId('ruleSubject').value,
      moveTo: byId('ruleFolder').value,
      delete: byId('ruleDelete').checked,
      markRead: byId('ruleRead').checked,
    };
    try {
      if (rule) await api('/api/rules/' + encodeURIComponent(rule.id), 'PATCH', data);
      else await api('/api/rules', 'POST', data);
      await showRules();
    } catch (error) {
      notice(error.message);
    } finally {
      save.disabled = false;
    }
  };
}

byId('searchForm').onsubmit = event => { event.preventDefault(); loadMail(); };
byId('clearSearch').onclick = () => { byId('search').value = ''; loadMail(); };
byId('refresh').onclick = refresh;
byId('filter').onchange = () => loadMail();
byId('more').onclick = () => loadMail(true);
byId('newMail').onclick = () => compose();
byId('markRead').onclick = () => markSelected(true);
byId('markUnread').onclick = () => markSelected(false);
byId('move').onclick = moveSelected;
byId('archive').onclick = () => bulk([...state.selected],
  id => api(messageUrl(id) + '/move', 'POST', { destinationId: 'archive' }), 'Archived');
byId('delete').onclick = () => {
  const ids = [...state.selected];
  if (ids.length && confirm(`Delete ${ids.length} selected message(s)?`)) {
    bulk(ids, id => api(messageUrl(id), 'DELETE'), 'Deleted');
  }
};
byId('selectAll').onchange = event => {
  state.selected = new Set(event.target.checked ? state.messages.map(message => message.id) : []);
  renderMessages();
};
byId('rules').onclick = () => showRules().catch(error => notice(error.message));
byId('logout').onclick = async () => {
  try {
    await api('/api/logout', 'POST');
    location.reload();
  } catch (error) { notice(error.message); }
};

async function start() {
  closeReader();
  updateSelection();
  try {
    const session = await api('/api/session');
    byId('account').textContent = session.who || '';
  } catch (error) { notice(error.message); }
  await loadFolders();
  await loadMail();
}

start();
</script>
</body>
</html>

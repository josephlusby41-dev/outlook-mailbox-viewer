<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Console</title>
<style>
:root{--ink:#172c40;--muted:#536c7f;--line:#d7e4ec;--blue:#175e85;--wash:#edf4f7;--active:#deedf4}
*{box-sizing:border-box}
body{margin:0;background:var(--wash);color:var(--ink);font:14px system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button,select,input:not([type=checkbox]),textarea{background:white;border:1px solid #b2c5d3;border-radius:8px;padding:8px 10px}
button{cursor:pointer}
button:hover:not(:disabled){background:var(--active)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid #bc791a;outline-offset:2px}
[hidden]{display:none!important}
h1,h2,p{margin-top:0}
.top{min-height:64px;background:#112b41;color:white;display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0 auto 0 0}
.top button{background:#24475e;color:white;border-color:#496b80}
.top button:hover{background:#365d76}
#account{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d5e5ee}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;padding:14px;height:calc(100dvh - 64px)}
.sidebar{overflow:auto}
.sidebar h2{font-size:13px;color:var(--muted);margin:17px 8px 8px}
.sidebar>.primary{width:100%;text-align:left}
.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:650}
.primary:hover:not(:disabled){background:#104865}
.folder-line{display:flex;align-items:center}
.folder{display:flex;justify-content:space-between;align-items:center;gap:7px;flex:1;border-color:transparent;background:transparent;text-align:left;min-width:0}
.folder[aria-current=true]{background:#dcebf1;font-weight:700}
.toggle{border:0;background:transparent;padding:5px}
.children{margin-left:12px;border-left:1px solid var(--line)}
.count{font-size:12px;font-weight:700;color:var(--blue)}
.main{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.search input{flex:1;min-width:130px}
.compose-files{padding:9px 0;border-block:1px solid var(--line);margin-top:12px}
.compose-files ul{padding:0;margin:6px 0;list-style:none}
.compose-files li{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;overflow-wrap:anywhere}
.search-refiners{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:0;padding:0;margin:0}
.search-refiners legend{float:left;margin:5px 8px 0 0;color:var(--muted);font-weight:600}
.search-refiners label{display:flex;gap:5px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:14px;background:white}
.search-refiners label:has(:checked){background:#def1e9;border-color:#76ad9d}
.panes{display:grid;grid-template-columns:minmax(235px,38%) minmax(0,1fr);gap:12px;flex:1;min-height:0}
.list,.reader{min-width:0;overflow:auto;background:white;border:1px solid var(--line);border-radius:14px}
.list-head{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:1}
.list-head h2{font-size:15px;flex:1;margin:0}
.mail{display:grid;grid-template-columns:19px minmax(0,1fr);gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.mail.current{background:var(--active)}
.mail.unread{box-shadow:inset 3px 0 var(--blue)}
.mail.unread .subject{font-weight:700;color:var(--blue)}
.mail button{border:0;padding:0;background:transparent;text-align:left;min-width:0}
.mail span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.mail .from{display:flex;justify-content:space-between;gap:6px}
.mail time{font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
#rows>p,.list-foot{padding:12px;margin:0}
.reader{padding:22px}
.reader h2{overflow-wrap:anywhere}
.reader .actions{margin-bottom:12px}
.message-body{overflow:auto;overflow-wrap:anywhere;line-height:1.5}
.message-body img{max-width:100%}
.message-body pre{white-space:pre-wrap}
.back{display:none}
.danger{color:#a1293b}
dialog{width:min(600px,94vw);max-height:90dvh;padding:20px;border:1px solid var(--line);border-radius:14px}
dialog::backdrop{background:#112b4166}
dialog label{display:block;margin:9px 0}
dialog input:not([type=checkbox]),dialog select,dialog textarea{display:block;width:100%;margin-top:4px}
dialog textarea{min-height:145px;resize:vertical}
dialog .actions{margin-top:12px}
#notice{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;max-width:90vw;padding:10px 14px;border-radius:8px;background:#112b41;color:white}
#dialogError{color:#a1293b;margin:10px 0 0}
@media(max-width:760px){
  .shell{display:block;height:auto;padding:10px}
  .sidebar{margin-bottom:10px}
  .sidebar>.primary{width:auto}
  .sidebar h2{margin:8px}
  #folders{max-height:155px;overflow:auto}
  .panes{display:block}
  .reader{display:none}
  .panes.reading .reader{display:block;padding:14px}
  .panes.reading .list{display:none}
  .back{display:inline-block;margin-bottom:10px}
}
</style>
</head>
<body>
<header class="top">
  <h1>Mail Console</h1>
  <span id="account"></span>
  <button id="logout">Sign out</button>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="Mailbox navigation">
    <button class="primary" id="newMail">＋ New mail</button>
    <h2>Folders</h2>
    <nav id="folders" aria-label="Mail folders"></nav>
  </aside>
  <main class="main">
    <form class="actions search" id="searchForm" role="search">
      <input type="search" id="search" placeholder="Search mail" aria-label="Search mail">
      <select id="scope" aria-label="Search scope">
        <option value="folder">This folder</option><option value="all">All folders</option>
      </select>
      <button class="primary" type="submit">Search</button>
      <button type="button" id="clearSearch">Clear</button>
    </form>
    <fieldset class="search-refiners" id="refiners">
      <legend>Filter results</legend>
      <label><input type="checkbox" value="attachments"> Has attachments</label>
      <label><input type="checkbox" value="unread"> Unread</label>
      <label><input type="checkbox" value="flagged"> Flagged</label>
      <label><input type="checkbox" value="important"> High importance</label>
    </fieldset>
    <div class="actions" aria-label="Mailbox actions">
      <button id="refresh">Refresh</button>
      <button id="readAll">Mark read</button>
      <button id="unreadAll">Mark unread</button>
      <button id="archive">Archive</button>
      <button id="move">Move…</button>
      <button id="remove" class="danger">Delete</button>
    </div>
    <div class="panes" id="panes">
      <section class="list" aria-labelledby="folderName">
        <div class="list-head">
          <input type="checkbox" id="selectAll" aria-label="Select loaded messages">
          <h2 id="folderName">Inbox</h2>
        </div>
        <div id="rows" aria-busy="true"><p class="muted">Loading messages…</p></div>
        <div class="list-foot"><button id="more" hidden>Load more</button></div>
      </section>
      <section class="reader" id="reader" aria-label="Reading pane"></section>
    </div>
  </main>
</div>

<dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
<div id="notice" role="status" hidden></div>

<script>
const CSRF = '__CSRF__';
const el = id => document.getElementById(id);
const state = {
  folder: 'inbox', roots: [], children: new Map(), expanded: new Set(),
  mail: [], selected: new Set(), cursor: null, query: '', open: null,
  listVersion: 0, readerVersion: 0, folderVersion: 0,
};
const escapeHtml = value => String(value ?? '').replace(
  /[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]),
);
const byAddress = recipient => recipient?.emailAddress || {};
const messageUrl = id => '/api/messages/' + encodeURIComponent(id);
const graphUrl = id => '/me/messages/' + encodeURIComponent(id);
const allFolders = () => [...state.roots, ...Array.from(state.children.values()).flat()];

async function request(path, method = 'GET', data) {
  const response = await fetch(path, {
    method, headers: {'Content-Type':'application/json','X-CSRF-Token':CSRF},
    body: data === undefined ? undefined : JSON.stringify(data),
  });
  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    throw new Error(error.message || `Request failed (${response.status}).`);
  }
  return response;
}

async function api(path, method, data) {
  const response = await request(path, method, data);
  return response.status === 204 ? {} : response.json();
}

function graph(method, path, payload) {
  return api('/api/graph', 'POST', {method, path, payload});
}

function notice(message) {
  const box = el('notice');
  const dialogError = el('dialogError');
  if (el('dialog').open && dialogError) {
    dialogError.textContent = message;
    return;
  }
  box.textContent = message;
  box.hidden = false;
  clearTimeout(box.timer);
  box.timer = setTimeout(() => { box.hidden = true; }, 5500);
}

function button(label, action, className = '') {
  const control = document.createElement('button');
  control.type = 'button';
  control.className = className;
  control.textContent = label;
  control.onclick = async () => {
    control.disabled = true;
    try { await action(); }
    catch (error) { notice(error.message); }
    finally { control.disabled = false; }
  };
  return control;
}

function dialog(title, markup) {
  const box = el('dialog');
  box.innerHTML = `<h2 id="dialogTitle">${escapeHtml(title)}</h2>${markup}<p id="dialogError" role="alert"></p>`;
  if (!box.open) box.showModal();
  box.querySelector('[data-close]')?.addEventListener('click', () => box.close());
}

function dateLabel(value, short = false) {
  const date = new Date(value);
  if (!value || Number.isNaN(+date)) return '';
  return short
    ? date.toLocaleDateString(undefined, {month:'short',day:'numeric'})
    : date.toLocaleString();
}

function renderFolders() {
  const nav = el('folders');
  nav.replaceChildren();

  function addFolders(target, folders, ancestors = new Set()) {
    for (const folder of folders) {
      if (ancestors.has(folder.id)) continue;
      const row = document.createElement('div');
      row.className = 'folder-line';
      if (folder.childFolderCount) {
        const expanded = state.expanded.has(folder.id);
        const toggle = button(expanded ? '▾' : '▸', async () => {
          if (!state.expanded.delete(folder.id)) {
            if (!state.children.has(folder.id)) {
              const result = await api('/api/folders?' + new URLSearchParams({parent:folder.id}));
              state.children.set(folder.id, result.folders || []);
            }
            state.expanded.add(folder.id);
          }
          renderFolders();
        }, 'toggle');
        toggle.setAttribute('aria-label', `${expanded ? 'Collapse' : 'Expand'} ${folder.displayName}`);
        toggle.setAttribute('aria-expanded', String(expanded));
        row.append(toggle);
      }

      const control = button(folder.displayName || 'Folder', async () => {
        state.folder = folder.id;
        el('search').value = '';
        el('scope').value = 'folder';
        for (const refiner of el('refiners').querySelectorAll(':checked')) refiner.checked = false;
        renderFolders();
        await loadMail();
      }, 'folder');
      if (folder.id === state.folder) control.setAttribute('aria-current', 'true');
      if (folder.unreadItemCount) {
        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = folder.unreadItemCount;
        control.append(count);
      }
      row.append(control);
      target.append(row);
      if (state.expanded.has(folder.id)) {
        const children = document.createElement('div');
        children.className = 'children';
        addFolders(children, state.children.get(folder.id) || [], new Set([...ancestors, folder.id]));
        target.append(children);
      }
    }
  }

  addFolders(nav, state.roots);
}

async function loadFolders() {
  const version = ++state.folderVersion;
  try {
    const result = await api('/api/folders');
    if (version !== state.folderVersion) return;
    state.roots = result.folders || [];
    const inbox = state.roots.find(folder => /^inbox$/i.test(folder.displayName));
    if (inbox) {
      if (state.folder === 'inbox') state.folder = inbox.id;
      state.roots.sort((a, b) => Number(b === inbox) - Number(a === inbox));
    }
    renderFolders();

    const expanded = [...state.expanded];
    await Promise.all(expanded.map(async id => {
      try {
        const child = await api('/api/folders?' + new URLSearchParams({parent:id}));
        if (version === state.folderVersion && state.expanded.has(id)) {
          state.children.set(id, child.folders || []);
        }
      } catch (error) {
        if (version === state.folderVersion) notice(error.message);
      }
    }));
    if (expanded.length && version === state.folderVersion) renderFolders();
  } catch (error) {
    if (version === state.folderVersion) notice(error.message);
  }
}

function closeReader() {
  state.readerVersion++;
  state.open = null;
  el('panes').classList.remove('reading');
  el('reader').innerHTML = '<p class="muted">Select a message to read it.</p>';
  el('rows').querySelector('.current')?.classList.remove('current');
}

function updateSelection() {
  const size = state.selected.size;
  el('selectAll').checked = size > 0 && size === state.mail.length;
  el('selectAll').indeterminate = size > 0 && !el('selectAll').checked;
  for (const id of ['readAll','unreadAll','archive','move','remove']) el(id).disabled = !size;
}

async function loadMail(append = false) {
  if (append && !state.cursor) return;
  const version = ++state.listVersion;
  const rows = el('rows');
  const more = el('more');
  const query = append ? new URLSearchParams(state.query) : new URLSearchParams();
  if (append) {
    query.set('cursor', state.cursor);
  } else {
    const search = el('search').value.trim();
    const refiners = [...el('refiners').querySelectorAll(':checked')];
    const wholeMailbox = Boolean(search || refiners.length) && el('scope').value === 'all';
    const folder = allFolders().find(item => item.id === state.folder);
    query.set('folder', wholeMailbox ? 'all' : state.folder);
    if (search) query.set('search', search);
    for (const refiner of refiners) query.append('refine', refiner.value);
    el('folderName').textContent = search || refiners.length
      ? (wholeMailbox ? 'All folders · Results' : (folder?.displayName || 'Inbox') + ' · Results')
      : folder?.displayName || 'Inbox';
    state.query = query.toString();
    state.cursor = null;
    state.mail = [];
    state.selected.clear();
    updateSelection();
    closeReader();
    rows.innerHTML = '<p class="muted">Loading messages…</p>';
    more.hidden = true;
  }

  rows.setAttribute('aria-busy', 'true');
  more.disabled = true;
  try {
    const result = await api('/api/messages?' + query);
    if (version !== state.listVersion) return;
    const seen = new Set(state.mail.map(item => item.id));
    for (const item of result.messages || []) {
      if (!seen.has(item.id)) {
        state.mail.push(item);
        seen.add(item.id);
      }
    }
    state.cursor = result.cursor;
    renderMail();
    if (result.warning) notice(result.warning);
  } catch (error) {
    if (version !== state.listVersion) return;
    if (append) notice(error.message);
    else rows.innerHTML = `<p role="alert">${escapeHtml(error.message)}</p>`;
  } finally {
    if (version === state.listVersion) {
      rows.setAttribute('aria-busy', 'false');
      more.hidden = !state.cursor;
      more.disabled = false;
    }
  }
}

function renderMail() {
  const rows = el('rows');
  const folder = allFolders().find(item => item.id === state.folder);
  const mailboxSearch = new URLSearchParams(state.query).get('folder') === 'all';
  const sent = !mailboxSearch && /^(sent items|outbox|drafts)$/i.test(folder?.displayName || '');
  rows.replaceChildren();

  for (const item of state.mail) {
    const row = document.createElement('article');
    row.className = 'mail' + (item.isRead ? '' : ' unread') + (item.id === state.open ? ' current' : '');
    row.dataset.message = item.id;
    const selected = document.createElement('input');
    selected.type = 'checkbox';
    selected.setAttribute('aria-label', 'Select ' + (item.subject || 'message'));
    selected.checked = state.selected.has(item.id);
    selected.onchange = () => {
      if (selected.checked) state.selected.add(item.id);
      else state.selected.delete(item.id);
      updateSelection();
    };
    const person = byAddress(sent ? item.toRecipients?.[0] : item.from);
    const open = document.createElement('button');
    open.type = 'button';
    open.innerHTML = `<span class="from"><strong>${escapeHtml(person.name || person.address || 'Unknown')}</strong>
      <time>${escapeHtml(dateLabel((sent && item.sentDateTime) || item.receivedDateTime, true))}</time></span>
      <span class="subject">${item.hasAttachments ? '📎 ' : ''}${item.flag?.flagStatus === 'flagged' ? '⚑ ' : ''}${escapeHtml(item.subject || '(no subject)')}</span>
      <span class="muted">${escapeHtml(item.bodyPreview)}</span>`;
    open.onclick = () => openMessage(item.id);
    row.append(selected, open);
    rows.append(row);
  }
  if (!state.mail.length) rows.innerHTML = state.cursor
    ? '<p class="muted">No matches on this page. Select Load more to check older results.</p>'
    : '<p class="muted">No messages found.</p>';
  updateSelection();
}

async function openMessage(id) {
  const version = ++state.readerVersion;
  state.open = id;
  for (const row of el('rows').querySelectorAll('.mail')) {
    row.classList.toggle('current', row.dataset.message === id);
  }
  el('panes').classList.add('reading');
  const reader = el('reader');
  const back = button('Back to messages', closeReader, 'back');
  const status = document.createElement('p');
  status.textContent = 'Loading message…';
  reader.replaceChildren(back, status);

  try {
    const item = await api(messageUrl(id));
    if (version !== state.readerVersion) return;
    const from = byAddress(item.from);
    const to = (item.toRecipients || []).map(entry => byAddress(entry).address).filter(Boolean);
    const header = document.createElement('div');
    header.innerHTML = `<h2>${escapeHtml(item.subject || '(no subject)')}</h2>
      <p class="muted"><b>From</b> ${escapeHtml(from.address || from.name)}<br>
      <b>To</b> ${escapeHtml(to.join(', '))}<br>
      ${escapeHtml(dateLabel(item.receivedDateTime || item.sentDateTime))}</p>`;

    const actions = document.createElement('div');
    actions.className = 'actions';
    if (item.isDraft) {
      actions.append(button('Edit draft', () => compose('draft', item), 'primary'));
    } else {
      actions.append(
        button('Reply', () => compose('reply', item), 'primary'),
        button('Reply all', () => compose('replyAll', item)),
        button('Forward', () => compose('forward', item)),
      );
    }
    const flagged = item.flag?.flagStatus === 'flagged';
    actions.append(
      button(item.isRead ? 'Mark unread' : 'Mark read', async () => {
        const isRead = !item.isRead;
        await api(messageUrl(id) + '/read', 'POST', {isRead});
        const cached = state.mail.find(entry => entry.id === id);
        if (cached) cached.isRead = isRead;
        if (isRead && new URLSearchParams(state.query).getAll('refine').includes('unread')) {
          await loadMail();
        } else {
          renderMail();
          if (state.readerVersion === version) await openMessage(id);
        }
        await loadFolders();
      }),
      button(flagged ? 'Clear flag' : 'Flag', async () => {
        const flag = {flagStatus: flagged ? 'notFlagged' : 'flagged'};
        await graph('PATCH', graphUrl(id), {flag});
        const cached = state.mail.find(entry => entry.id === id);
        if (cached) cached.flag = flag;
        renderMail();
        if (state.readerVersion === version) await openMessage(id);
      }),
      button('Delete', async () => {
        if (!confirm('Delete this message?')) return;
        await api(messageUrl(id), 'DELETE');
        await refresh();
      }, 'danger'),
    );

    const files = document.createElement('div');
    files.className = 'actions';
    const body = document.createElement('div');
    body.className = 'message-body';
    body.innerHTML = item.safeHtml || escapeHtml(item.bodyPreview);
    reader.replaceChildren(back, header, actions, files, body);

    if (item.hasAttachments) await showFiles(id, files);
  } catch (error) {
    if (version === state.readerVersion) status.textContent = error.message;
  }
}

async function showFiles(id, container) {
  try {
    const result = await api(messageUrl(id) + '/attachments');
    for (const file of result.attachments || []) {
      if (file.isInline) continue;
      const name = file.name || 'Attachment';
      container.append(button('Download ' + name, async () => {
        const path = graphUrl(id) + '/attachments/' + encodeURIComponent(file.id) + '/$value';
        const response = await request('/api/download', 'POST', {path, name});
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }));
    }
  } catch (error) {
    container.textContent = error.message;
  }
}

async function refresh() {
  await Promise.all([loadMail(), loadFolders()]);
}

async function bulk(ids, operation, label) {
  if (!ids.length) return;
  let done = 0;
  try {
    for (const id of ids) {
      await operation(id);
      done++;
    }
    notice(`${label} ${done} message(s).`);
  } catch (error) {
    notice(`${label} ${done} of ${ids.length} message(s). ${error.message}`);
  } finally {
    await refresh();
  }
}

function markSelected(isRead) {
  return bulk([...state.selected], id => api(messageUrl(id) + '/read', 'POST', {isRead}),
    isRead ? 'Marked read' : 'Marked unread');
}

function moveSelected() {
  const ids = [...state.selected];
  if (!ids.length) return;
  dialog('Move messages', `<label>Destination<select id="destination"></select></label>
    <div class="actions"><button data-close>Cancel</button><button id="confirmMove" class="primary">Move</button></div>`);
  for (const folder of allFolders()) el('destination').add(new Option(folder.displayName, folder.id));
  el('confirmMove').onclick = () => {
    const destinationId = el('destination').value;
    if (!destinationId) return notice('Choose a destination folder.');
    el('dialog').close();
    bulk(ids, id => api(messageUrl(id) + '/move', 'POST', {destinationId}), 'Moved');
  };
}

function recipients(raw) {
  return raw.split(/[,;]/).map(address => address.trim()).filter(Boolean)
    .map(address => ({emailAddress:{address}}));
}

function compose(mode = 'new', item) {
  const title = {new:'New mail',draft:'Edit draft',reply:'Reply',replyAll:'Reply all',forward:'Forward'}[mode];
  const editable = mode === 'new' || mode === 'draft';
  const addressed = editable || mode === 'forward';
  dialog(title, `
    ${addressed ? '<label>To<input id="to" placeholder="Separate addresses with commas"></label>' : ''}
    ${editable ? '<details id="copyFields"><summary>Cc and Bcc</summary><label>Cc<input id="cc"></label><label>Bcc<input id="bcc"></label></details><label>Subject<input id="subject"></label>' :
      `<p class="muted">${escapeHtml(item.subject || '(no subject)')}</p>`}
    <label>Message<textarea id="body"></textarea></label>
    <section class="compose-files" aria-label="Attachments">
      <button type="button" id="attachFiles">Attach files</button>
      <input type="file" id="composeFiles" multiple hidden>
      <span class="muted">Under 3 MB per file</span>
      <ul id="composeFileList"></ul>
      <p id="composeProgress" class="muted" role="status" hidden></p>
    </section>
    <div class="actions"><button data-close>Cancel</button>
    ${editable ? '<button id="saveDraft">Save draft</button>' : ''}
    <button class="primary" id="send">Send</button></div>`);

  if (mode === 'draft') {
    for (const [field, key] of [['to','toRecipients'],['cc','ccRecipients'],['bcc','bccRecipients']]) {
      el(field).value = (item[key] || []).map(entry => byAddress(entry).address).filter(Boolean).join(', ');
    }
    el('copyFields').open = Boolean(el('cc').value || el('bcc').value);
    el('subject').value = item.subject || '';
    if ((item.body?.contentType || '').toLowerCase() === 'html') {
      const plain = new DOMParser().parseFromString(item.safeHtml || '', 'text/html');
      el('body').value = plain.body.textContent;
    } else {
      el('body').value = item.body?.content || '';
    }
  }

  const send = el('send');
  const save = el('saveDraft');
  const attach = el('attachFiles');
  const picker = el('composeFiles');
  const fileList = el('composeFileList');
  const progress = el('composeProgress');
  const composeDialog = el('dialog');
  const cancel = composeDialog.querySelector('[data-close]');
  const errors = el('dialogError');
  let draftId = mode === 'draft' ? item.id : null;
  let replyBody;
  const attachments = [];
  let busy = false;

  attach.onclick = () => picker.click();
  picker.onchange = () => {
    const invalid = [];
    for (const file of picker.files) {
      if (!file.size || file.size >= 3000000) invalid.push(file.name);
      else attachments.push({file, id:null});
    }
    errors.textContent = invalid.length ? 'Skipped empty or oversized files: ' + invalid.join(', ') : '';
    picker.value = '';
    renderFiles();
  };

  function renderFiles() {
    fileList.replaceChildren();
    for (const entry of attachments) {
      const row = document.createElement('li');
      const name = document.createElement('span');
      name.textContent = entry.file.name + ' · ' + Math.max(1, Math.round(entry.file.size / 1024)) + ' KB';
      const remove = button('Remove', async () => {
        if (busy) return;
        if (entry.id) {
          busy = true;
          send.disabled = attach.disabled = true;
          if (save) save.disabled = true;
          try {
            await api('/api/features/graph', 'POST', {
              method:'DELETE', path:graphUrl(draftId) + '/attachments/' + encodeURIComponent(entry.id),
            });
          } finally {
            busy = false;
            send.disabled = attach.disabled = false;
            if (save) save.disabled = false;
          }
        }
        attachments.splice(attachments.indexOf(entry), 1);
        renderFiles();
      });
      remove.disabled = busy;
      remove.setAttribute('aria-label', 'Remove ' + entry.file.name);
      row.append(name, remove);
      fileList.append(row);
    }
  }

  function fields() {
    return {
      to:el('to')?.value || '', cc:el('cc')?.value || '', bcc:el('bcc')?.value || '',
      subject:el('subject')?.value || '', body:el('body').value,
    };
  }

  async function saveDraft(values) {
    const payload = {
      subject: values.subject,
      body: {contentType:'Text', content:values.body},
      toRecipients: recipients(values.to),
      ccRecipients: recipients(values.cc),
      bccRecipients: recipients(values.bcc),
    };
    if (draftId) {
      await graph('PATCH', graphUrl(draftId), payload);
    } else {
      const draft = await graph('POST', '/me/messages', payload);
      if (!draft.id) throw new Error('Microsoft did not return the draft ID. Check Drafts before retrying.');
      draftId = draft.id;
    }
    await uploadFiles();
  }

  async function uploadFiles() {
    for (const entry of attachments) {
      if (entry.id) continue;
      progress.hidden = false;
      progress.textContent = 'Attaching ' + entry.file.name + '…';
      const data = new FormData();
      data.append('file', entry.file);
      const response = await fetch('/api/features/attachments/' + encodeURIComponent(draftId), {
        method:'POST', headers:{'X-CSRF-Token':CSRF}, body:data,
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.id) {
        throw new Error(result.message || ('Could not attach ' + entry.file.name + '. Try again.'));
      }
      entry.id = result.id;
    }
  }

  async function saveReplyDraft(values) {
    if (!draftId) {
      const create = {reply:'createReply', replyAll:'createReplyAll', forward:'createForward'}[mode];
      const payload = mode === 'forward' ? {toRecipients:recipients(values.to)} : {};
      const draft = await graph('POST', graphUrl(item.id) + '/' + create, payload);
      if (!draft.id) throw new Error('Microsoft did not return the draft ID. Check Drafts before retrying.');
      draftId = draft.id;
      replyBody = draft.body;
    }
    const quote = replyBody?.content || '';
    const html = replyBody?.contentType?.toLowerCase() === 'html';
    const comment = '<div>' + escapeHtml(values.body).replace(/\r?\n/g, '<br>') + '</div>';
    const body = html
      ? {contentType:'HTML', content:/<body\b[^>]*>/i.test(quote)
        ? quote.replace(/<body\b[^>]*>/i, start => start + comment)
        : comment + quote}
      : {contentType:'Text', content: [values.body, quote].filter(Boolean).join('\n\n')};
    const payload = {body};
    if (mode === 'forward') payload.toRecipients = recipients(values.to);
    await graph('PATCH', graphUrl(draftId), payload);
    await uploadFiles();
  }

  async function submit(action, message) {
    if (busy) return;
    busy = true;
    attach.disabled = cancel.disabled = true;
    const preventClose = event => event.preventDefault();
    composeDialog.addEventListener('cancel', preventClose);
    send.disabled = true;
    if (save) save.disabled = true;
    errors.textContent = '';
    progress.hidden = false;
    progress.textContent = message === 'Sent.' ? 'Sending…' : 'Saving draft…';
    renderFiles();
    try {
      await action(fields());
      if (send.isConnected) el('dialog').close();
      notice(message);
      await refresh();
    } catch (error) {
      notice(error.message);
    } finally {
      busy = false;
      attach.disabled = cancel.disabled = false;
      composeDialog.removeEventListener('cancel', preventClose);
      progress.hidden = true;
      send.disabled = false;
      if (save) save.disabled = false;
      renderFiles();
    }
  }

  if (save) save.onclick = () => submit(saveDraft, 'Draft saved.');
  send.onclick = () => submit(async values => {
    if (addressed && !recipients(values.to).length) throw new Error('Enter at least one recipient.');
    if (mode === 'new' && !draftId && !attachments.length) {
      await api('/api/send', 'POST', values);
    } else if (editable) {
      await saveDraft(values);
      progress.textContent = 'Sending…';
      await graph('POST', graphUrl(draftId) + '/send');
    } else if (draftId || attachments.length) {
      await saveReplyDraft(values);
      progress.textContent = 'Sending…';
      await graph('POST', graphUrl(draftId) + '/send');
    } else {
      const payload = {comment:values.body};
      if (mode === 'forward') payload.toRecipients = recipients(values.to);
      await graph('POST', graphUrl(item.id) + '/' + mode, payload);
    }
  }, 'Sent.');

  if (mode === 'draft' && item.hasAttachments) {
    api('/api/messages/' + encodeURIComponent(item.id) + '/attachments').then(result => {
      if (!fileList.isConnected || !composeDialog.open) return;
      for (const file of result.attachments || []) {
        if (!file.isInline) attachments.push({file, id:file.id});
      }
      renderFiles();
    }).catch(error => {
      if (fileList.isConnected && composeDialog.open) errors.textContent = error.message;
    });
  }
}

el('searchForm').onsubmit = event => { event.preventDefault(); loadMail(); };
el('clearSearch').onclick = () => {
  el('search').value = '';
  el('scope').value = 'folder';
  for (const refiner of el('refiners').querySelectorAll(':checked')) refiner.checked = false;
  loadMail();
};
el('refiners').onchange = () => loadMail();
el('more').onclick = () => loadMail(true);
el('refresh').onclick = refresh;
el('newMail').onclick = () => compose();
el('readAll').onclick = () => markSelected(true);
el('unreadAll').onclick = () => markSelected(false);
el('move').onclick = moveSelected;
el('archive').onclick = () => bulk([...state.selected],
  id => api(messageUrl(id) + '/move', 'POST', {destinationId:'archive'}), 'Archived');
el('remove').onclick = () => {
  const ids = [...state.selected];
  if (ids.length && confirm(`Delete ${ids.length} selected message(s)?`)) {
    bulk(ids, id => api(messageUrl(id), 'DELETE'), 'Deleted');
  }
};
el('selectAll').onchange = event => {
  state.selected = new Set(event.target.checked ? state.mail.map(item => item.id) : []);
  renderMail();
};
el('logout').onclick = async () => {
  try { await api('/api/logout', 'POST'); location.replace('/'); }
  catch (error) { notice(error.message); }
};

async function start() {
  closeReader();
  updateSelection();
  api('/api/session').then(data => { el('account').textContent = data.who || ''; })
    .catch(error => notice(error.message));
  await loadFolders();
  await loadMail();
}
start();
</script>
  <script src="/static/mailbox-features.js"></script>
</body>
</html>

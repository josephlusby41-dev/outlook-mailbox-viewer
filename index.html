<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Console</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', -apple-system, Roboto, 'Helvetica Neue', sans-serif; background: #faf9f8; color: #201f1e; font-size: 14px; }
header { background: #0078d4; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 20px; gap: 12px; }
header h1 { font-size: 16px; font-weight: 600; flex: 1; }
header button { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
header button:hover { background: rgba(255,255,255,.25); }
.wrap { max-width: 1200px; margin: 20px auto; padding: 0 16px; display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
@media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } }
.panel { background: #fff; border: 1px solid #e1dfdd; border-radius: 6px; padding: 14px; }
.panel h2 { font-size: 13px; text-transform: uppercase; color: #605e5c; margin-bottom: 10px; letter-spacing: .5px; }
.folder-item { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 4px; cursor: pointer; color: #323130; }
.folder-item:hover { background: #f3f2f1; }
.folder-item.active { background: #cfe4f7; font-weight: 600; }
.badge { background: #0078d4; color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 7px; }
.cap { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin: 2px; }
.cap.ok { background: #dff6dd; color: #107c10; }
.cap.missing { background: #fde7e9; color: #a4262c; }
.cap.unknown { background: #edebe9; color: #605e5c; }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 0; flex-wrap: wrap; }
.toolbar input[type=text] { flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid #8a8886; border-radius: 4px; }
button.act { background: #0078d4; color: #fff; border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
button.act:disabled { background: #a19f9d; cursor: default; }
button.act.danger { background: #a4262c; }
button.act.ghost { background: #fff; color: #0078d4; border: 1px solid #0078d4; }
table { width: 100%; border-collapse: collapse; background: #fff; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #edebe9; font-size: 13px; }
th { background: #f3f2f1; font-size: 12px; }
tr.unread td { font-weight: 600; }
tr:hover td { background: #f3f2f1; }
.from-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subj-cell { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow-y: auto; }
.modal-back.open { display: flex; }
.modal { background: #fff; border-radius: 8px; padding: 24px; max-width: 720px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
.modal h3 { margin-bottom: 14px; }
.modal label { display: block; font-size: 12px; color: #605e5c; margin: 10px 0 4px; }
.modal input[type=text], .modal textarea, .modal select { width: 100%; padding: 8px 10px; border: 1px solid #8a8886; border-radius: 4px; font: inherit; }
.modal textarea { min-height: 120px; }
.modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
#msgBody img { max-width: 100%; }
#msgBody pre { white-space: pre-wrap; word-break: break-word; font: inherit; }
.rules-list .rule { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-bottom: 1px solid #edebe9; }
.rules-list .rule:last-child { border-bottom: none; }
.muted { color: #a19f9d; font-size: 12px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #323130; color: #fff; padding: 10px 20px; border-radius: 4px; display: none; z-index: 99; }
.toast.err { background: #a4262c; }
</style>
</head>
<body>
<header>
  <h1 id="who">Mail Console</h1>
  <button onclick="openRules()">Inbox rules</button>
  <button onclick="doLogout()">Sign out</button>
</header>

<div class="wrap">
  <div>
    <div class="panel" style="margin-bottom:16px">
      <h2>Folders</h2>
      <div id="folders"><div class="muted">Loading…</div></div>
    </div>
    <div class="panel">
      <h2>Token capabilities</h2>
      <div id="caps" class="muted">Loading…</div>
      <div style="margin-top:8px" class="muted" id="sessInfo"></div>
    </div>
  </div>

  <div>
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search mail…" onkeydown="if(event.key==='Enter')loadMail()">
      <button class="act ghost" onclick="loadMail()">Search</button>
      <button class="act" onclick="openCompose()">New mail</button>
      <button class="act danger" onclick="bulkDelete()">Delete selected</button>
      <button class="act ghost" onclick="bulkRead()">Mark read</button>
      <button class="act ghost" onclick="bulkMove()">Move…</button>
    </div>
    <table>
      <thead><tr>
        <th style="width:34px"><input type="checkbox" id="selAll" onchange="selAllChange()"></th>
        <th style="width:70px"></th><th>From</th><th>Subject</th><th style="width:150px">Received</th>
      </tr></thead>
      <tbody id="mailRows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- message / compose / rules modals -->
<div class="modal-back" id="back">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const CSRF = '__CSRF__';
let state = { folder: 'inbox', messages: [], cursor: null, caps: {}, folders: [] };

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF }, opts.headers || {});
  const r = await fetch(path, opts);
  if (!r.ok) {
    let m = 'Request failed';
    try { m = (await r.json()).message || m; } catch (e) {}
    toast(m, true);
    throw new Error(m);
  }
  if (r.status === 204) return {};
  return r.json();
}

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : '');
  t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

// ---------- init ----------
async function init() {
  try {
    const s = await api('/api/session');
    state.caps = s.capabilities || {};
    document.getElementById('who').textContent = s.who || 'Mail Console';
    const bits = [];
    for (const [name, c] of Object.entries(state.caps)) {
      bits.push(`<span class="cap ${c.state}">${esc(name)}</span>`);
    }
    document.getElementById('caps').innerHTML = bits.join(' ') || '<span class="cap unknown">unknown scopes</span>';
    document.getElementById('sessInfo').textContent =
      `client: ${(s.clientId || '').slice(0, 8)}… · refresh: ${s.refreshEnabled ? 'on' : 'off'} · ` +
      `token expires in ${Math.max(0, Math.round((s.expiresAt - Date.now() / 1000) / 60))} min`;
  } catch (e) {}
  await loadFolders();
  await loadMail();
}

async function loadFolders() {
  try {
    const d = await api('/api/folders');
    state.folders = d.folders || [];
    document.getElementById('folders').innerHTML = state.folders.map(f =>
      `<div class="folder-item ${f.id === state.folder ? 'active' : ''}" onclick="pickFolder('${esc(f.id)}')">
         <span>${esc(f.displayName)}</span>
         ${f.unreadItemCount ? `<span class="badge">${f.unreadItemCount}</span>` : ''}
       </div>`).join('');
  } catch (e) {}
}

function pickFolder(id) {
  state.folder = id;
  loadFolders(); loadMail();
}

// ---------- mail ----------
async function loadMail() {
  const q = new URLSearchParams({ folder: state.folder });
  const s = document.getElementById('search').value.trim();
  if (s) q.set('search', s);
  document.getElementById('mailRows').innerHTML = '<tr><td colspan="5" class="muted">Loading…</td></tr>';
  try {
    const d = await api('/api/messages?' + q);
    state.messages = d.messages || [];
    state.cursor = d.cursor;
    renderMail();
  } catch (e) {
    document.getElementById('mailRows').innerHTML =
      `<tr><td colspan="5" class="muted">${esc(e.message)}</td></tr>`;
  }
}

function renderMail() {
  const rows = state.messages.map(m => `
    <tr class="${m.isRead ? '' : 'unread'}" data-id="${esc(m.id)}">
      <td><input type="checkbox" class="sel"></td>
      <td>${m.hasAttachments ? '📎' : ''}${m.importance === 'high' ? '❗' : ''}</td>
      <td class="from-cell" onclick="openMessage('${esc(m.id)}')">${esc((m.from && m.from.emailAddress && m.from.emailAddress.name) || (m.from && m.from.emailAddress && m.from.emailAddress.address) || '')}</td>
      <td class="subj-cell" onclick="openMessage('${esc(m.id)}')">${esc(m.subject || '(no subject)')}</td>
      <td>${new Date(m.receivedDateTime).toLocaleString()}</td>
    </tr>`).join('');
  document.getElementById('mailRows').innerHTML = rows ||
    '<tr><td colspan="5" class="muted">No messages.</td></tr>';
}

function selectedIds() {
  return [...document.querySelectorAll('#mailRows tr')].filter(tr => tr.querySelector('.sel').checked)
    .map(tr => tr.dataset.id);
}
function selAllChange() {
  const on = document.getElementById('selAll').checked;
  document.querySelectorAll('#mailRows .sel').forEach(c => c.checked = on);
}

async function bulkDelete() {
  const ids = selectedIds();
  if (!ids.length) return toast('Select messages first.', true);
  for (const id of ids) await api('/api/messages/' + encodeURIComponent(id), { method: 'DELETE' });
  toast(`Deleted ${ids.length} message(s).`);
  loadMail(); loadFolders();
}

async function bulkRead() {
  const ids = selectedIds();
  if (!ids.length) return toast('Select messages first.', true);
  for (const id of ids) await api('/api/messages/' + encodeURIComponent(id) + '/read',
    { method: 'POST', body: JSON.stringify({ isRead: true }) });
  toast(`Marked ${ids.length} read.`); loadMail();
}

function bulkMove() {
  const ids = selectedIds();
  if (!ids.length) return toast('Select messages first.', true);
  const opts = state.folders.map(f => `<option value="${esc(f.id)}">${esc(f.displayName)}</option>`).join('');
  showModal(`<h3>Move ${ids.length} message(s)</h3>
    <label>Destination folder</label><select id="mvDest">${opts}</select>
    <div class="row"><button class="act ghost" onclick="closeModal()">Cancel</button>
    <button class="act" onclick="doBulkMove()">Move</button></div>`);
}

async function doBulkMove() {
  const dest = document.getElementById('mvDest').value;
  const ids = selectedIds();
  for (const id of ids) await api('/api/messages/' + encodeURIComponent(id) + '/move',
    { method: 'POST', body: JSON.stringify({ destinationId: dest }) });
  closeModal(); toast(`Moved ${ids.length} message(s).`); loadMail(); loadFolders();
}

async function openMessage(id) {
  try {
    const m = await api('/api/messages/' + encodeURIComponent(id));
    const to = (m.toRecipients || []).map(r => r.emailAddress.address).join(', ');
    showModal(`<h3>${esc(m.subject || '(no subject)')}</h3>
      <div class="muted">From: ${esc(m.from && m.from.emailAddress ? m.from.emailAddress.address : '')}<br>
      To: ${esc(to)}<br>${new Date(m.receivedDateTime || m.sentDateTime).toLocaleString()}</div>
      <div id="msgBody" style="margin-top:14px">${m.safeHtml || esc(m.bodyPreview)}</div>
      <div class="row"><button class="act ghost" onclick="closeModal()">Close</button>
      <button class="act" onclick="reply('${esc(m.id)}')">Reply</button>
      <button class="act danger" onclick="delOne('${esc(m.id)}')">Delete</button></div>`);
  } catch (e) {}
}

async function delOne(id) {
  await api('/api/messages/' + encodeURIComponent(id), { method: 'DELETE' });
  closeModal(); toast('Deleted.'); loadMail(); loadFolders();
}

// ---------- compose / reply ----------
function openCompose(replyTo) {
  const m = state.messages.find(x => x.id === replyTo) || null;
  showModal(`<h3>${m ? 'Reply' : 'New mail'}</h3>
    <label>To</label><input type="text" id="cTo" value="${m && m.from ? esc(m.from.emailAddress.address) : ''}">
    <label>Subject</label><input type="text" id="cSubj" value="${m ? 'Re: ' + esc(m.subject || '') : ''}">
    <label>Body (HTML allowed)</label><textarea id="cBody"></textarea>
    <div class="row"><button class="act ghost" onclick="closeModal()">Cancel</button>
    <button class="act" onclick="doSend()">Send</button></div>`);
}

async function doSend() {
  await api('/api/send', { method: 'POST', body: JSON.stringify({
    to: document.getElementById('cTo').value,
    subject: document.getElementById('cSubj').value,
    body: document.getElementById('cBody').value,
  })});
  closeModal(); toast('Sent.');
}

function reply(id) { openCompose(id); }

// ---------- rules ----------
async function openRules() {
  let d;
  try { d = await api('/api/rules'); }
  catch (e) {
    showModal(`<h3>Inbox rules</h3><p>Your token can't read rules (${esc(e.message)}).<br>
      Re-consent with <b>MailboxSettings.ReadWrite</b> included, then retry.</p>
      <div class="row"><button class="act" onclick="closeModal()">OK</button></div>`);
    return;
  }
  const rows = (d.rules || []).map(r => `
    <div class="rule">
      <div>
        <b>${esc(r.displayName)}</b> ${r.isEnabled ? '' : '<span class="muted">(disabled)</span>'}
        <div class="muted">${esc(JSON.stringify(r.conditions))}</div>
        <div class="muted">${esc(JSON.stringify(r.actions))}</div>
      </div>
      <div>
        <button class="act ghost" onclick="editRule('${esc(r.id)}')">Edit</button>
        <button class="act danger" onclick="delRule('${esc(r.id)}')">Delete</button>
      </div>
    </div>`).join('');
  showModal(`<h3>Inbox rules</h3>
    <div class="rules-list">${rows || '<p class="muted">No rules yet.</p>'}</div>
    <div class="row"><button class="act ghost" onclick="closeModal()">Close</button>
    <button class="act" onclick="editRule(null)">New rule</button></div>`);
}

const FOLDERS_OPTS = () => state.folders.map(f =>
  `<option value="${esc(f.id)}">${esc(f.displayName)}</option>`).join('');

function editRule(rid) {
  showModal(`<h3>${rid ? 'Edit rule' : 'New rule'}</h3>
    <label>Rule name</label><input type="text" id="rName">
    <label>If sender contains</label><input type="text" id="rFrom">
    <label>If subject contains</label><input type="text" id="rSubj">
    <label>Then move to folder</label><select id="rMove"><option value="">— none —</option>${FOLDERS_OPTS()}</select>
    <div style="margin-top:10px">
      <label><input type="checkbox" id="rDelete"> Delete the message</label><br>
      <label><input type="checkbox" id="rMarkRead"> Mark as read</label>
    </div>
    <div class="row"><button class="act ghost" onclick="closeModal()">Cancel</button>
    <button class="act" onclick="saveRule('${rid || ''}')">Save rule</button></div>`);
}

async function saveRule(rid) {
  const body = {
    displayName: document.getElementById('rName').value,
    fromContains: document.getElementById('rFrom').value,
    subjectContains: document.getElementById('rSubj').value,
    moveTo: document.getElementById('rMove').value,
    delete: document.getElementById('rDelete').checked,
    markRead: document.getElementById('rMarkRead').checked,
  };
  if (rid) await api('/api/rules/' + encodeURIComponent(rid), { method: 'PATCH', body: JSON.stringify(body) });
  else await api('/api/rules', { method: 'POST', body: JSON.stringify(body) });
  closeModal(); toast('Rule saved.'); openRules();
}

async function delRule(rid) {
  await api('/api/rules/' + encodeURIComponent(rid), { method: 'DELETE' });
  toast('Rule deleted.'); openRules();
}

// ---------- modal plumbing ----------
function showModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('back').classList.add('open');
}
function closeModal() { document.getElementById('back').classList.remove('open'); }
document.getElementById('back').addEventListener('click', e => {
  if (e.target.id === 'back') closeModal();
});

async function doLogout() {
  await api('/api/logout', { method: 'POST' });
  location.reload();
}

init();
</script>
</body>
</html>
